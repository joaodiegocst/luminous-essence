<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminous Essence - Loja Online</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #fdfcf9;
      color: #333;
    }
    header {
      background: #d4a373;
      color: white;
      padding: 12px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-icon {
      font-size: 22px;
      cursor: pointer;
      color: #000000;
      padding: 8px;
    }
    .logo {
      height: 50px;
    }
    section {
      padding: 12px;
      text-align: center;
    }
    .produtos {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* padrão desktop */
      gap: 12px;
      margin-top: 12px;
    }
    h2.produtos-title {
      font-size: 20px;
      margin-bottom: 12px;
      color: black;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
      align-items: stretch; /* imagem ocupa toda largura */
      padding: 0; /* remove padding interno */
    }
    .card:hover {
      transform: scale(1.02);
    }
    .card img {
      width: 100%;
      height: 200px; /* altura ajustada para proporção equilibrada */
      object-fit: cover;
      display: block;
      margin: 0;
    }
    .card-content {
      padding: 8px; /* espaço apenas para textos */
      text-align: center;
    }
    .card h3 {
      font-size: 14px;
      margin: 4px 0;
    }
    .price {
      font-size: 15px;
      font-weight: bold;
      color: #d4a373;
      margin: 4px 0;
    }
    button {
      background: #d4a373;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 6px;
    }
    button:hover {
      background: #b07d4f;
    }
    footer {
      background: #d4a373;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
    .social-icon {
      font-size: 22px;
      margin: 0 6px;
      text-decoration: none;
      transition: transform 0.3s;
      color: white;
    }
    .social-icon:hover {
      transform: scale(1.2);
    }

    /* Responsividade */
    @media (max-width: 1024px) {
      .produtos {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 768px) {
      .produtos {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 480px) {
      .produtos {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.8);

      /* centraliza conteúdo */
      justify-content: center;
      align-items: center;
    }

    .modal.show {
      display: flex; /* mantém flex quando ativo */
    }

    .modal-content {
      max-width: 80%;
      max-height: 80%;
      border-radius: 8px;
      animation: zoomIn 0.4s;
      position: relative; /* referência para o botão fechar */
    }

    .close {
      position: absolute;
      top: 10px;
      right: 10px;
      color: #fff;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    @keyframes zoomIn {
      from {transform: scale(0.7);}
      to {transform: scale(1);}
    }

  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <app-menu></app-menu>
      <img src="assets/image/logo.jpeg" alt="Logo Luminous Essence" class="logo">
      <div class="cart-icon" routerLink="/carrinho"><i class="fas fa-shopping-cart"></i></div>
    </div>
  </header>

  <section id="produtos">
    <h2 class="produtos-title">Produtos</h2>
    <div class="produtos">
      <div class="card" *ngFor="let produto of produtos">
        <img [src]="produto.imagem" [alt]="produto.nome" class="produto-img" (click)="abrirModal(produto.imagem)">
        <h3>{{ produto.nome }}</h3>
        <p class="price">{{ produto.preco }}</p>
        <button>Comprar</button>
      </div>
    </div>
  </section>

  <!-- Modal -->
  <div class="modal" [ngClass]="{'show': modalAberto}" (click)="fecharModal()">
    <span class="close" (click)="fecharModal()">&times;</span>
    <img class="modal-content" [src]="imagemSelecionada">
  </div>

  <footer>
    <p>&copy; 2026 Luminous Essence - Todos os direitos reservados</p>
    <a href="https://wa.me/5542999541198" target="_blank" class="social-icon">
      <i class="fab fa-whatsapp"></i>
    </a>
    <a href="https://www.instagram.com/lumiinous.essence" target="_blank" class="social-icon">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://www.tiktok.com/@lumiinous.essence" target="_blank" class="social-icon">
      <i class="fab fa-tiktok"></i>
    </a>
  </footer>
</body>
</html>
